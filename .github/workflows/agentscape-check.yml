name: AgentScape Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    name: Runtime / World / Studio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify no line-ending or generated drift
        run: |
          git diff --check
          test -z "$(git status --porcelain)"
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: MCP compatibility gate (provider-free)
        run: npm run test:mcp
      - name: Dependency security gate
        run: npm audit --audit-level=moderate
      - name: Storybook compatibility
        run: npm run storybook:build
      - name: Package standalone development SDK
        run: |
          npm run sdk:verify
          mkdir -p .tmp-release
          npm pack ./sdk/typescript --pack-destination .tmp-release
      - name: Preserve SDK artifact
        uses: actions/upload-artifact@v7
        with:
          name: agentscape-development-sdk
          path: .tmp-release/
          include-hidden-files: true
          retention-days: 14

  browser:
    name: Studio browser acceptance (fixed protocol)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Collect performance baseline
        run: node dev/report-browser-baseline.mjs
      - name: Preserve browser report and failure evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: studio-browser-acceptance
          path: |
            playwright-report/
            test-results/browser/
            .tmp-release/browser-baseline.json
          retention-days: 14

  python-sdk:
    name: Python SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: 3.12
          enable-cache: true
          cache-dependency-glob: sdk/python/uv.lock
      - run: uv sync --frozen --extra dev
      - run: uv run pytest -q
      - run: uv run python -m compileall -q agentscape tests
      - run: uv build

  asset-compiler:
    name: Asset Compiler Service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.11
          cache: pip
          cache-dependency-path: |
            services/asset-compiler/requirements.txt
            services/asset-compiler/requirements-test.txt
      - run: pip install -r services/asset-compiler/requirements-test.txt
      - name: Test service conversion and geometry modules
        working-directory: services/asset-compiler
        run: python -m unittest -v test_app.py test_part_geometry.py
