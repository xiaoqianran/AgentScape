name: Mirror Repository

on:
  push:
    branches:
      - "**"
    tags:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-mirror-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mirror:
    name: GitHub -> CNB1 / CNB2 / GitCode
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate mirror credentials
        env:
          CNB1_TOKEN: ${{ secrets.CNB1_TOKEN }}
          CNB2_TOKEN: ${{ secrets.CNB2_TOKEN }}
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CNB1_TOKEN" || { echo "::error::Missing GitHub Actions secret: CNB1_TOKEN"; exit 1; }
          test -n "$CNB2_TOKEN" || { echo "::error::Missing GitHub Actions secret: CNB2_TOKEN"; exit 1; }
          test -n "$GITCODE_TOKEN" || { echo "::error::Missing GitHub Actions secret: GITCODE_TOKEN"; exit 1; }

      - name: Sync pushed ref to CNB1, CNB2 and GitCode
        env:
          CNB1_TOKEN: ${{ secrets.CNB1_TOKEN }}
          CNB2_TOKEN: ${{ secrets.CNB2_TOKEN }}
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          git remote add cnb1 "https://cnb:${CNB1_TOKEN}@cnb.cool/xiaoqianran/AgentScape.git"
          git remote add cnb2 "https://cnb:${CNB2_TOKEN}@cnb.cool/chutianqiu/AgentScape.git"
          git remote add gitcode "https://xiaoqianran:${GITCODE_TOKEN}@gitcode.com/xiaoqianran/AgentScape.git"

          if [ "$REF_TYPE" = "branch" ]; then
            refspec="HEAD:refs/heads/$REF_NAME"
          elif [ "$REF_TYPE" = "tag" ]; then
            refspec="refs/tags/$REF_NAME:refs/tags/$REF_NAME"
          else
            echo "::error::Unsupported ref type: $REF_TYPE"
            exit 1
          fi

          status=0
          git push cnb1 "$refspec" || status=1
          git push cnb2 "$refspec" || status=1
          git push gitcode "$refspec" || status=1

          if [ "$status" -ne 0 ]; then
            echo "::error::One or more mirror targets failed."
            exit "$status"
          fi

          echo "Mirrored $REF_TYPE $REF_NAME to CNB1, CNB2 and GitCode."
