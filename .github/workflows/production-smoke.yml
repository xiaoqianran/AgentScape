name: Production Smoke Check

on:
  workflow_dispatch:
  deployment_status:

permissions:
  contents: read

jobs:
  vercel-production:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Verify published pages, JS bundles and capability API with specific diagnostics
        env:
          URL: https://agentscape-virid.vercel.app
        run: node dev/check-production-smoke.mjs