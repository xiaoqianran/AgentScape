name: Production Smoke Check

on:
  workflow_dispatch:
  deployment_status:

permissions:
  contents: read

jobs:
  vercel-production:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify Studio, all published examples and capability API
        env:
          URL: https://agentscape-virid.vercel.app
        run: |
          set -euo pipefail
          for entry in "/|AgentScape" "/home/|AgentScape Home" "/starter/|AgentScape · First world" "/observatory/|AgentScape Observatory" "/examples/code-project/|自由代码世界 · AgentScape" "/examples/native-scene/|原生 Three.js · AgentScape" "/examples/three-code/|AgentScape code assets"; do
            path="${entry%%|*}"
            title="${entry#*|}"
            html="$(mktemp)"
            curl --fail --location --silent --show-error --retry 6 --retry-delay 2 --retry-all-errors --connect-timeout 10 --max-time 30 "${URL}${path}" -o "$html"
            grep -Fq "<title>${title}</title>" "$html"
            asset="$(grep -oE 'src="/assets/[^"]+\.js"' "$html" | head -1 | cut -d'"' -f2)"
            test -n "$asset"
            curl --fail --location --silent --show-error --retry 4 --retry-delay 2 --retry-all-errors --connect-timeout 10 --max-time 30 "${URL}${asset}" -o /dev/null
            echo "Verified ${path} and ${asset}"
            rm -f "$html"
          done
          for endpoint in "/api/capabilities" "/api/capabilities/health"; do
            payload="$(mktemp)"
            curl --fail --location --silent --show-error --retry 4 --retry-delay 2 --retry-all-errors --connect-timeout 10 --max-time 30 "$URL$endpoint" -o "$payload"
            node -e '
              const fs=require("node:fs");
              const json=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));
              for(const capability of ["agent","asset.compile"]){
                const value=json.capabilities?.[capability];
                if(typeof value?.available!=="boolean")throw Error("Missing capability: "+capability);
                if(process.argv[2].endsWith("/health") && !["unconfigured","ok","slow","down"].includes(value.state))
                  throw Error("Invalid health state: "+capability);
              }
            ' "$payload" "$endpoint"
            echo "Verified $endpoint (optional backends may be unconfigured)"
            rm -f "$payload"
          done
          echo "Vercel production smoke passed: $URL"
