name: Python SDK Check

on:
  push:
    paths:
      - 'sdk/python/**'
      - '.github/workflows/python-sdk.yml'
  pull_request:
    paths:
      - 'sdk/python/**'
      - '.github/workflows/python-sdk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: sdk/python/uv.lock
      - run: uv sync --frozen --extra dev
      - run: uv run pytest -q
      - run: uv run python -m compileall -q agentscape tests
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: agentscape-client-dist
          path: sdk/python/dist/*
