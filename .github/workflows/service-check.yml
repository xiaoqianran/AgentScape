name: Asset Compiler Service Check

on:
  push:
    paths:
      - 'services/asset-compiler/**'
      - '.github/workflows/service-check.yml'
  pull_request:
    paths:
      - 'services/asset-compiler/**'
      - '.github/workflows/service-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compiler-service:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            services/asset-compiler/requirements.txt
            services/asset-compiler/requirements-test.txt

      - name: Install service dependencies
        run: pip install -r services/asset-compiler/requirements-test.txt

      - name: Test service conversion and geometry modules
        working-directory: services/asset-compiler
        run: python -m unittest -v test_app.py test_part_geometry.py
