[project]
name = "agentscape-client"
version = "0.1.0"
description = "Orchestrate image generation and image-to-3D providers into reusable 3D assets."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
agentscape = "agentscape.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentscape"]

[tool.pytest.ini_options]
testpaths = ["tests"]
