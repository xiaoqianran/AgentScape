$:
  # ===== 开发环境（vscode + docker-in-docker），Cloud Studio 环境声明 =====
  vscode:
    - docker:
        image: docker.cnb.cool/xiaoqianran/java-21-node-22
      services:
        - vscode
        - docker
      stages:
        - name: ls
          script: ls

main:
  push:
    - name: sync-to-github

      imports:
        - https://cnb.cool/xiaoqianran/agentscape-keystore/-/blob/main/github.yml

      stages:
        - name: push-to-github
          script: |
            set -eu

            mkdir -p ~/.ssh

            printf '%s\n' "$GITHUB_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519

            ssh-keyscan github.com >> ~/.ssh/known_hosts

            git remote remove github 2>/dev/null || true
            git remote add github git@github.com:xiaoqianran/AgentScape.git

            GIT_SSH_COMMAND="ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes" \
              git push github HEAD:main