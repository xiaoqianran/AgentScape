$:
  # ===== 开发环境（vscode + docker-in-docker），Cloud Studio 环境声明 =====
  vscode:
    - docker:
        image: docker.cnb.cool/xiaoqianran/java-21-node-22
      services:
        - vscode
        - docker
      stages:
        - name: ls
          script: ls

# Near-real-time CNB -> GitHub request. Requires CNB_GITHUB_DISPATCH_TOKEN
# imported from a private CNB secret file. See docs/operations/cnb-github-sync.md.
main:
  push:
    - name: notify-github-reconcile
      imports:
        - https://cnb.cool/xiaoqianran/agentscape-keystore/-/blob/main/github.yml
      stages:
        - name: dispatch-if-github-behind
          script: |
            set -eu
            if [ -z "${CNB_GITHUB_DISPATCH_TOKEN:-}" ]; then
              echo "Realtime dispatch inactive: configure CNB_GITHUB_DISPATCH_TOKEN."
              exit 0
            fi
            github_sha="$(git ls-remote https://github.com/xiaoqianran/AgentScape.git refs/heads/main | cut -f1)"
            test -n "$github_sha" || { echo "Unable to inspect GitHub main" >&2; exit 1; }
            if [ "$github_sha" = "$CNB_BRANCH_SHA" ]; then
              echo "Already synced, skip dispatch."
              exit 0
            fi
            curl --fail-with-body --silent --show-error --retry 2 \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $CNB_GITHUB_DISPATCH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/json" \
              -d '{"event_type":"cnb-main-updated"}' \
              https://api.github.com/repos/xiaoqianran/AgentScape/dispatches
            echo "GitHub reconciliation requested."
