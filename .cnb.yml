$:
  # ===== 开发环境（vscode + docker-in-docker），Cloud Studio 环境声明 =====
  vscode:
    - docker:
        image: docker.cnb.cool/xiaoqianran/java-21-node-22
      services:
        - vscode
        - docker
      stages:
        - name: ls
          script: ls

main:
  push:
    - name: sync-to-github

      imports:
        - https://cnb.cool/xiaoqianran/agentscape-keystore/-/blob/main/github.yml

      stages:
        - name: push-to-github
          script: |
            set -eu

            mkdir -p ~/.ssh

            printf '%s\n' "$GITHUB_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519

            git remote remove github 2>/dev/null || true
            git remote add github git@github.com:xiaoqianran/AgentScape.git

            # 远端 main 已包含本次提交（GitHub 侧 Actions 会自行 reconcile），
            # 直接跳过，避免「无内容可推」把流水线刷红。
            REMOTE_SHA=$(git ls-remote github refs/heads/main 2>/dev/null | cut -f1 || true)
            if [ -n "$REMOTE_SHA" ] && [ "$REMOTE_SHA" = "$CNB_COMMIT" ]; then
              echo "GitHub main 已是 $CNB_COMMIT，无需同步（幂等跳过）"
              exit 0
            fi

            GIT_SSH_COMMAND="ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
              git push github "HEAD:refs/heads/main"
